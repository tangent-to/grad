name: Release

# Triggered by pushing a version tag created with `npm version` (see RELEASING.md):
#   npm version patch && git push --follow-tags
# Publishes the version in package.json / deno.json to npm and JSR, each with
# provenance. Safe to re-run: the npm job skips a version already on the registry.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance attestation + JSR OIDC authentication

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Pin npm 11: trusted publishing needs >= 11.5.1, and npm 12.0.0 broke the
      # publish step the day it became `latest` — ds hit exactly this, and every
      # tag run after it failed where 11.x had succeeded hours earlier. Bump
      # deliberately, not by tracking `latest`.
      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1 and Node >= 22.14)
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm run test:run
      - name: Publish (skip if this version is already on npm)
        run: |
          NAME=$(node -p 'require("./package.json").name')
          VER=$(node -p 'require("./package.json").version')
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER already on npm — skipping."
          else
            npm publish --provenance --access public
          fi

  jsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Install npm dependencies (@tangent.to/lina) into node_modules so deno
      # can resolve the bare npm imports in src/ when caching and publishing.
      # JSR does not vendor them, but publish-time resolution needs them
      # present. This workflow was copied from lina, which is dependency-free
      # and so never needed the step; grad does.
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      # Vouch for the resolved dependency graph with the supply-chain cooldown
      # disabled, so a package can be released the same day as an intra-suite
      # dependency it was just published alongside. Writes an (untracked)
      # deno.lock, hence --allow-dirty below.
      - name: Resolve dependencies (bypass cooldown for intra-suite deps)
        run: deno cache --minimum-dependency-age=0 src/index.js
      # Idempotent like the npm job: a Release run can half-succeed (npm
      # published, JSR not), and re-running it must not fail on the half that
      # already went out.
      - name: Publish (skip if this version is already on JSR)
        run: |
          NAME=$(node -p 'require("./deno.json").name')
          VER=$(node -p 'require("./deno.json").version')
          if curl -fsS "https://jsr.io/${NAME}/${VER}_meta.json" >/dev/null 2>&1; then
            echo "$NAME@$VER already on JSR — skipping."
          else
            deno publish --allow-dirty
          fi

  github-release:
    name: Create GitHub Release
    needs: [npm, jsr]
    # workflow_dispatch can fire from a branch, where github.ref_name is not a
    # version tag. Only tag pushes should produce a release entry.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating a release needs more than the workflow default
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes walks back to the previous tag
      - name: Create the release (skip if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release — skipping."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi

  refresh-site-api:
    name: Refresh the suite site's API reference
    needs: [npm, jsr]
    runs-on: ubuntu-latest
    # Never let a documentation refresh mark a successful publish as failed.
    # The packages are on npm and JSR by the time this runs; the worst case here
    # is that the site's API reference waits for its weekly schedule.
    continue-on-error: true
    steps:
      # The site keeps a generated API reference per package, committed so its
      # build never needs the package repos. A release changes that reference,
      # so tell the site to regenerate. GITHUB_TOKEN cannot dispatch across
      # repositories, hence a dedicated secret; without it this is a no-op and
      # the site's weekly schedule picks the change up instead.
      - name: Notify tangent-to/suite
        env:
          GH_TOKEN: ${{ secrets.SUITE_DISPATCH_TOKEN }}
        # The guard lives in the shell, not in an `if:`. GitHub does not expose
        # the `secrets` context to a step-level condition — using it there does
        # not merely evaluate false, it makes the whole workflow file
        # unparseable, so every release fails rather than skipping this one job.
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'SUITE_DISPATCH_TOKEN is not set — skipping. The site picks the'
            echo 'change up on its weekly schedule instead.'
            exit 0
          fi
          if ! gh api repos/tangent-to/suite/dispatches \
                 -f event_type=api-update \
                 -F "client_payload[package]=${{ github.event.repository.name }}" \
                 -F "client_payload[tag]=${{ github.ref_name }}"; then
            echo '::warning::Could not notify tangent-to/suite. A 401 means the'
            echo '::warning::SUITE_DISPATCH_TOKEN secret is not a valid token; a 403 or'
            echo '::warning::404 means it lacks Contents:write on tangent-to/suite.'
            echo '::warning::The publish itself succeeded; the site will refresh on its'
            echo '::warning::weekly schedule.'
            exit 1
          fi
